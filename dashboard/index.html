<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Fleet Dashboard</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,0.10);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --seq: #2a78d6; --seq-track: #e1e0d9;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b; --good-text: #006300;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --seq: #3987e5; --seq-track: #2c2c2a; --good-text: #0ca30c;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --seq: #3987e5; --seq-track: #2c2c2a; --good-text: #0ca30c;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 16px; max-width: 1280px; margin: 0 auto; }
header h1 { font-size: 18px; margin: 0; }
nav { display: flex; flex-wrap: wrap; gap: 4px; }
nav button, .btn { font: inherit; border: 1px solid var(--ring); background: var(--surface); color: var(--ink-2); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
nav button[aria-selected="true"] { color: var(--ink); border-color: var(--ink-2); font-weight: 600; }
main { max-width: 1280px; margin: 0 auto; padding: 0 16px 48px; }
section[hidden] { display: none; }
.meta { color: var(--muted); font-size: 12px; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 14px 16px; min-width: 0; }
.card h3 { margin: 0 0 2px; font-size: 15px; }
.card .sub { color: var(--ink-2); font-size: 12px; margin-bottom: 10px; overflow-wrap: anywhere; }
.chip { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--ring); color: var(--ink-2); margin-left: 6px; vertical-align: 2px; }
.class-title { font-size: 13px; color: var(--ink-2); text-transform: uppercase; letter-spacing: .04em; margin: 20px 0 8px; }
.meter { margin: 8px 0; }
.meter .row { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--ink-2); }
.meter .row b { color: var(--ink); font-weight: 600; }
.gpu-name { margin: 12px 0 4px; font-size: 12px; color: var(--ink-2); }
.gpu-name b { color: var(--ink); font-weight: 600; }
.track { height: 8px; border-radius: 4px; background: var(--seq-track); overflow: hidden; margin-top: 4px; }
.fill { height: 100%; border-radius: 4px; background: var(--seq); }
.status { font-size: 12px; display: inline-flex; gap: 4px; align-items: center; }
.status .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); margin-bottom: 12px; }
.tile .v { font-size: 26px; font-weight: 600; }
.tile .l { color: var(--ink-2); font-size: 12px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 0 12px; }
select { font: inherit; background: var(--surface); color: var(--ink); border: 1px solid var(--ring); border-radius: 8px; padding: 5px 8px; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--ink-2); margin: 6px 0 4px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--ring); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.12); white-space: nowrap; z-index: 2; }
.tip .k { color: var(--ink-2); }
.tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 12px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th { color: var(--ink-2); font-weight: 600; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td.wrap { white-space: normal; overflow-wrap: anywhere; min-width: 160px; }
a { color: var(--s1); }
.empty { color: var(--ink-2); padding: 12px 0; }
.err { color: var(--critical); font-size: 12px; overflow-wrap: anywhere; }
.links { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; margin-bottom: 6px; }
ul.tree { list-style: none; margin: 4px 0 0; padding-left: 14px; border-left: 1px solid var(--grid); font-size: 12px; }
ul.tree li { margin: 3px 0; overflow-wrap: anywhere; }
code { font-size: 12px; }
details summary { cursor: pointer; color: var(--ink-2); font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
<header>
  <div><h1>Agent fleet</h1><div class="meta" id="updated">Loading…</div></div>
  <nav role="tablist">
    <button data-tab="projects" aria-selected="true">Projects</button>
    <button data-tab="machines">Machines</button>
    <button data-tab="quotas">Quotas</button>
    <button data-tab="usage">Tokens &amp; cost</button>
    <button data-tab="free">Free tokens</button>
    <button data-tab="prices">API prices</button>
    <button class="btn" id="refresh" title="Run collectors now">Refresh</button>
    <button class="btn" id="theme" title="Toggle light/dark">◐</button>
  </nav>
</header>
<main>
  <section id="tab-projects"></section>
  <section id="tab-machines" hidden></section>
  <section id="tab-quotas" hidden></section>
  <section id="tab-usage" hidden></section>
  <section id="tab-free" hidden></section>
  <section id="tab-prices" hidden></section>
</main>
<script>
"use strict";
const $ = (sel, root = document) => root.querySelector(sel);
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "style") el.style.cssText = v; else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : String(kid));
  return el;
}
function s(tag, attrs = {}) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}
const fmtInt = n => n == null ? "—" : Math.round(n).toLocaleString();
const fmtTok = n => n == null ? "—" : n >= 1e9 ? (n / 1e9).toFixed(2) + "B" : n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? (n / 1e3).toFixed(1) + "K" : String(n);
const fmtUsd = n => n == null ? "—" : "$" + (n >= 100 ? Math.round(n).toLocaleString() : n.toFixed(2));
const fmtGiB = b => b == null ? "—" : b >= 2 ** 40 ? (b / 2 ** 40).toFixed(1) + " TiB" : (b / 2 ** 30).toFixed(1) + " GiB";
function ago(iso) {
  if (!iso) return "—";
  const sec = (Date.now() - new Date(iso).getTime()) / 1000;
  if (sec < 90) return "just now";
  if (sec < 5400) return Math.round(sec / 60) + " min ago";
  if (sec < 129600) return Math.round(sec / 3600) + " h ago";
  return Math.round(sec / 86400) + " d ago";
}
function until(iso) {
  if (!iso) return "no reset time";
  const sec = (new Date(iso).getTime() - Date.now()) / 1000;
  if (sec <= 0) return "resetting";
  const d = Math.floor(sec / 86400), hr = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60);
  return "resets in " + (d ? `${d}d ${hr}h` : hr ? `${hr}h ${m}m` : `${m}m`);
}
const STATUS = { online: ["good", "Online"], live: ["good", "Live"], cached: ["good", "Cached"], unreachable: ["critical", "Unreachable"],
  unavailable: ["serious", "Unavailable"], untracked: ["warning", "Untracked"], stale: ["warning", "Stale"] };
function statusBadge(state) {
  const [role, label] = STATUS[state] || ["warning", state || "unknown"];
  const icon = role === "good" ? "●" : role === "critical" ? "✕" : "!";
  return h("span", { class: "status" }, h("span", { class: "dot", style: `background:var(--${role})`, "aria-hidden": "true" }), icon === "●" ? "" : icon + " ", label);
}
function meter(label, pct, detail, warnAbove = 90) {
  const p = pct == null ? 0 : Math.max(0, Math.min(100, pct));
  const fill = pct != null && pct >= warnAbove ? "var(--critical)" : "var(--seq)";
  return h("div", { class: "meter" },
    h("div", { class: "row" }, h("span", {}, label, pct != null && pct >= warnAbove ? " ⚠" : ""), h("span", {}, h("b", {}, pct == null ? "—" : p.toFixed(0) + "%"), detail ? "  " + detail : "")),
    h("div", { class: "track", role: "meter", "aria-valuenow": p, "aria-valuemin": 0, "aria-valuemax": 100, "aria-label": label }, h("div", { class: "fill", style: `width:${p}%;background:${fill}` })));
}
async function api(name) {
  try { const r = await fetch("/api/" + name, { cache: "no-store" }); return await r.json(); } catch { return { missing: true }; }
}
function fill(section, ...kids) { section.replaceChildren(...kids.flat().filter(k => k != null && k !== false)); }
function missing(section, what, cmd) {
  section.replaceChildren(h("p", { class: "empty" }, `No ${what} snapshot yet. It is collected in the background; or run `, h("code", {}, cmd), "."));
}

/* ---------------------------------------------------------------- projects */
const link = (url, text) => h("a", { href: url, target: "_blank", rel: "noopener" }, text);
function repoTree(node, depth = 0) {
  const subs = node.submodules || [], ext = node.external || [];
  const label = depth ? h("span", {}, h("code", {}, node.path), "  ", node.name ? link(node.url, node.name) : node.url) : null;
  const kids = [
    ...subs.map(n => h("li", {}, repoTree(n, depth + 1))),
    ext.length ? h("li", {}, h("details", {}, h("summary", {}, `${ext.length} external reference${ext.length > 1 ? "s" : ""} (not owned)`),
      h("ul", { class: "tree" }, ext.map(e => h("li", { class: "meta" }, h("code", {}, e.path), "  ", e.name ? link(e.url, e.name) : e.url))))) : null,
  ].filter(Boolean);
  return [label, kids.length ? h("ul", { class: "tree" }, kids) : null];
}
function countRepos(node) { return (node.name ? 1 : 0) + (node.submodules || []).reduce((a, n) => a + countRepos(n), 0); }
function renderProjects(data) {
  const sec = $("#tab-projects");
  const list = (data && data.projects) || [];
  if (!list.length) return fill(sec, h("p", { class: "empty" }, "No projects configured. Add one JSON file per project in projects/."));
  fill(sec,
    h("p", { class: "meta" }, "Projects this repo manages (projects/*.json). Each is a GitHub Project in a parent repository; owned repos are submodules, references sit under external/. Refresh the tree with ", h("code", {}, "uv run aao projects sync <id>"), "."),
    h("div", { class: "grid" }, list.map(p => {
      const gp = p.github_project || {}, repo = p.repo || {};
      return h("div", { class: "card" },
        h("h3", {}, p.title || p.id, h("span", { class: "chip" }, `${countRepos(repo)} repo${countRepos(repo) === 1 ? "" : "s"}`)),
        h("div", { class: "sub" }, p.description || ""),
        h("div", { class: "links" },
          gp.url ? link(gp.url, `GitHub Project #${gp.number}`) : h("span", { class: "err" }, `No GitHub Project yet: aao projects setup ${p.id}`),
          repo.name ? link(repo.url || `https://github.com/${repo.name}`, repo.name) : null),
        repoTree(repo),
        (p.warnings || []).map(w => h("div", { class: "err" }, "! " + w)),
        p.notes ? h("div", { class: "meta", style: "margin-top:8px" }, p.notes) : null);
    })));
}

/* ---------------------------------------------------------------- machines */
function renderMachines(data) {
  const sec = $("#tab-machines");
  if (!data || data.missing) return missing(sec, "machine", "uv run aao collect machines");
  const groups = { local: "This computer", ssh: "SSH machines (herdr)", cloud: "Cloud agents (AI labs)" };
  const out = [];
  for (const [cls, title] of Object.entries(groups)) {
    const ms = data.machines.filter(m => m.class === cls);
    if (!ms.length) continue;
    out.push(h("div", { class: "class-title" }, title));
    out.push(h("div", { class: "grid" }, ms.map(cls === "cloud" ? cloudCard : hostCard)));
  }
  if (data.herdr_error) out.push(h("p", { class: "err" }, "herdr: " + data.herdr_error));
  fill(sec, ...out);
}
function hostCard(m) {
  const host = m.host || {};
  const mem = host.memory || {};
  const memPct = mem.total ? 100 * (1 - mem.available / mem.total) : null;
  const cards = [h("h3", {}, m.label, h("span", { class: "chip" }, m.class)),
    h("div", { class: "sub" }, statusBadge(m.status), host.os ? `  ·  ${host.os} ${host.arch || ""} · ${host.cpu_count || "?"} CPUs · up ${Math.round((host.uptime_seconds || 0) / 86400)}d` : "",
      m.target && m.target !== m.label ? `  ·  ssh ${m.target}` : "")];
  if (m.error) cards.push(h("div", { class: "err" }, m.error));
  if (m.host) {
    cards.push(meter("CPU", host.cpu_percent, host.load_avg ? "load " + host.load_avg.map(x => x.toFixed(2)).join(" ") : ""));
    cards.push(meter("RAM", memPct, `${fmtGiB(mem.available)} free of ${fmtGiB(mem.total)}`));
    for (const d of host.disks || []) cards.push(meter("Disk " + d.mount, 100 * d.used / d.total, `${fmtGiB(d.free)} free`));
    for (const g of host.gpus || []) cards.push(...gpuMeters(g));
  }
  const ag = (m.herdr || {}).agents || [];
  const counts = Object.entries((m.herdr || {}).counts || {}).map(([k, v]) => `${v} ${k}`).join(", ");
  cards.push(h("details", {}, h("summary", {}, `herdr agents: ${ag.length}${counts ? " (" + counts + ")" : ""}`),
    ag.length ? h("div", { class: "table-wrap" }, h("table", {}, h("tr", {}, h("th", {}, "Agent"), h("th", {}, "Status"), h("th", {}, "Title"), h("th", {}, "Dir")),
      ag.map(a => h("tr", {}, h("td", {}, a.agent), h("td", {}, a.status), h("td", { class: "wrap" }, a.title || ""), h("td", { class: "wrap" }, a.cwd || ""))))) : h("div", { class: "empty" }, "No agent panes.")));
  return h("div", { class: "card" }, cards);
}
function gpuMeters(g) {
  const extra = [g.temperature_c != null ? `${Math.round(g.temperature_c)}°C` : "", g.power_w != null ? `${Math.round(g.power_w)} W` : ""]
    .filter(Boolean).join(" · ");
  const meters = [];
  if (g.util_percent != null) meters.push(meter("GPU load", g.util_percent, extra));
  if (g.memory_total && g.memory_used != null)
    meters.push(meter("VRAM", 100 * g.memory_used / g.memory_total, `${fmtGiB(g.memory_total - g.memory_used)} free of ${fmtGiB(g.memory_total)}`));
  const facts = [g.driver ? "driver " + g.driver : "", !meters.length && g.memory_total ? fmtGiB(g.memory_total) : "",
    !meters.length ? "no load data from the OS" : ""].filter(Boolean).join(" · ");
  return [h("div", { class: "gpu-name" }, h("b", {}, "GPU"), " ", g.name, facts ? h("span", { class: "meta" }, " · " + facts) : null), ...meters];
}
function cloudCard(m) {
  const counts = Object.entries(m.counts || {}).map(([k, v]) => `${v} ${k}`).join(", ") || "no tasks";
  const tasks = (m.tasks || []).slice(0, 8);
  return h("div", { class: "card" },
    h("h3", {}, m.label, h("span", { class: "chip" }, "cloud")),
    h("div", { class: "sub" }, statusBadge(m.status), "  ·  ", counts),
    m.error ? h("div", { class: m.status === "untracked" ? "meta" : "err" }, m.error) : null,
    tasks.length ? h("div", { class: "table-wrap" }, h("table", {}, h("tr", {}, h("th", {}, "Task"), h("th", {}, "State"), h("th", {}, "Repo")),
      tasks.map(t => h("tr", {}, h("td", { class: "wrap" }, t.url ? h("a", { href: t.url, target: "_blank", rel: "noopener" }, t.title || t.id) : (t.title || t.id)), h("td", {}, t.state), h("td", {}, t.repo || ""))))) : null,
    h("details", {}, h("summary", {}, "Dispatch"), h("code", { style: "font-size:12px;overflow-wrap:anywhere" }, m.dispatch)));
}

/* ------------------------------------------------------------------ quotas */
function renderQuotas(data) {
  const sec = $("#tab-quotas");
  if (!data || data.missing) return missing(sec, "quota", "uv run aao collect quotas");
  const cards = data.accounts.map(a => {
    const stale = a.retrieved_at && Date.now() - new Date(a.retrieved_at).getTime() > 3 * 3600e3;
    return h("div", { class: "card" },
      h("h3", {}, a.provider, a.plan ? h("span", { class: "chip" }, a.plan) : null),
      h("div", { class: "sub" }, statusBadge(stale ? "stale" : a.status), `  ·  ${ago(a.retrieved_at)} · via ${a.source}`, a.account ? ` · ${a.account}` : ""),
      a.error ? h("div", { class: "err" }, a.error) : null,
      (a.windows || []).map(w => {
        const warn = w.runs_out_before_reset;
        const usedPct = w.used_pct == null ? null : w.used_pct;
        const label = (w.scope ? w.scope + " · " : "") + w.name;
        const detail = `${w.remaining_pct ?? "—"}% left · ${w.resets_at ? until(w.resets_at) : w.reset_text || "no reset time"}` + (warn ? " · ⚠ runs out before reset" : "");
        return meter(label + " used", usedPct, detail, warn ? 0 : 95);
      }),
      a.balance ? h("div", { class: "sub" }, "Balance: " + a.balance.map(b => `${b.amount} ${b.currency}`).join(", ")) : null);
  });
  const errs = Object.entries(data.errors || {}).map(([k, v]) => h("div", { class: "err" }, `${k}: ${v}`));
  fill(sec, 
    h("p", { class: "meta" }, "Used share of each subscription window; the run-out warning projects the current burn rate to the reset time."),
    cards.length ? h("div", { class: "grid" }, cards) : h("p", { class: "empty" }, "No quota sources reported. Install clanker-usage (uv tool install clanker-usage) and/or quota-cli (cargo install quota-cli)."),
    errs.length ? h("details", {}, h("summary", {}, "Collector messages"), errs) : null);
}

/* ------------------------------------------------------------ tokens & cost */
const BUCKETS = [
  { key: "input", label: "Input (non-cached)", color: "var(--s1)" },
  { key: "cache_write", label: "Cache write", color: "var(--s2)" },
  { key: "cache_read", label: "Cache read", color: "var(--s3)" },
  { key: "output", label: "Output", color: "var(--s4)" },
];
const usageState = { range: 30, machine: "all", agent: "all", view: "all" };
let usageData = null;
function renderUsage(data) {
  usageData = data || usageData;
  const sec = $("#tab-usage");
  if (!usageData || usageData.missing) return missing(sec, "usage", "uv run aao collect usage");
  const cells = usageData.by_day_machine_agent_model;
  const machines = [...new Set(cells.map(c => c.machine))].sort();
  const agents = [...new Set(cells.map(c => c.agent))].sort();
  const sel = (name, opts) => h("select", { "aria-label": name, onchange: e => { usageState[name] = e.target.value; renderUsage(); } },
    opts.map(([v, l]) => h("option", { value: v, selected: String(usageState[name]) === String(v) }, l)));
  const filters = h("div", { class: "filters" },
    sel("range", [[7, "Last 7 days"], [30, "Last 30 days"], [90, "Last 90 days"]]),
    sel("machine", [["all", "All machines"], ...machines.map(m => [m, m])]),
    sel("agent", [["all", "All agents"], ...agents.map(a => [a, a])]),
    sel("view", [["all", "All token types"], ["nocache", "Without cache reads"]]));
  const start = new Date(Date.now() - (usageState.range - 1) * 86400e3).toISOString().slice(0, 10);
  const keep = c => c.day >= start && (usageState.machine === "all" || c.machine === usageState.machine) && (usageState.agent === "all" || c.agent === usageState.agent);
  const days = [];
  for (let t = new Date(start + "T00:00:00Z").getTime(); t <= Date.now(); t += 86400e3) days.push(new Date(t).toISOString().slice(0, 10));
  const byDay = Object.fromEntries(days.map(d => [d, { day: d, input: 0, cache_write: 0, cache_read: 0, output: 0, cost: 0, unpriced: 0 }]));
  const byModel = {};
  for (const c of cells.filter(keep)) {
    const d = byDay[c.day]; if (!d) continue;
    d.input += c.input; d.cache_write += c.cache_write_5m + c.cache_write_1h; d.cache_read += c.cache_read; d.output += c.output;
    d.cost += c.cost_usd || 0; if (!c.priced) d.unpriced += c.input + c.cache_read + c.output;
    const m = byModel[c.model] ||= { model: c.model, agent: c.agent, tokens: 0, cost: 0, priced: true };
    m.tokens += c.input + c.cache_write_5m + c.cache_write_1h + c.cache_read + c.output; m.cost += c.cost_usd || 0; if (!c.priced) m.priced = false;
  }
  const rows = Object.values(byDay);
  const total = k => rows.reduce((a, r) => a + r[k], 0);

function niceMax(v) { if (v <= 0) return 1; const p = 10 ** Math.floor(Math.log10(v)); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p; return 10 * p; }
